<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level — after choosing a letter set</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:24px 20px 4px">
    <h1 style="margin:0 0 4px;font-size:26px;font-weight:800;color:#0f2e2b">Level</h1>
    <div style="font-size:13px;color:#5b7773">Each level checks one more thing</div>
  </div>

  <div style="flex-grow:1;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%">

      <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="width:96px;height:96px;border-radius:50%;background:conic-gradient(rgba(15,143,132,0.30) 0deg 90deg,#c6e3dd 90deg 360deg);display:flex;align-items:center;justify-content:center">
          <div style="width:74px;height:74px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:30px;color:#0f2e2b">1</span>
          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:#5b7773;text-align:center;line-height:1.3">Shape only</div>
      </div>

      <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="width:96px;height:96px;border-radius:50%;background:conic-gradient(rgba(15,143,132,0.55) 0deg 180deg,#c6e3dd 180deg 360deg);display:flex;align-items:center;justify-content:center">
          <div style="width:74px;height:74px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:30px;color:#0f2e2b">2</span>
          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:#5b7773;text-align:center;line-height:1.3">+ where you start</div>
      </div>

      <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="width:96px;height:96px;border-radius:50%;background:conic-gradient(rgba(15,143,132,0.78) 0deg 270deg,#c6e3dd 270deg 360deg);display:flex;align-items:center;justify-content:center">
          <div style="width:74px;height:74px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:30px;color:#0f2e2b">3</span>
          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:#5b7773;text-align:center;line-height:1.3">+ the path</div>
      </div>

      <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px">
        <div style="width:96px;height:96px;border-radius:50%;background:#0f8f84;display:flex;align-items:center;justify-content:center">
          <div style="width:74px;height:74px;border-radius:50%;background:#0f8f84;border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:30px;color:#ffffff">4</span>
          </div>
        </div>
        <div style="font-size:12px;font-weight:700;color:#ffffff;background:#0f8f84;border-radius:6px;padding:2px 8px;text-align:center;line-height:1.3">+ pen lifts</div>
      </div>

    </div>

    <!-- Legend: same fill progression, no words needed -->
    <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
      <div style="width:14px;height:14px;border-radius:4px;background:rgba(15,143,132,0.30)"></div>
      <div style="width:14px;height:14px;border-radius:4px;background:rgba(15,143,132,0.55)"></div>
      <div style="width:14px;height:14px;border-radius:4px;background:rgba(15,143,132,0.78)"></div>
      <div style="width:14px;height:14px;border-radius:4px;background:#0f8f84"></div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
