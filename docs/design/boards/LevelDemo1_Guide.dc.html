<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level 1 — shape only</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;padding:7px 13px;border-radius:999px;background:#0f8f84;color:#ffffff">PRACTICE</span>
    <span style="font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid #bfddd7;background:#ffffff;color:#5b7773">Level 1 · Shape only</span>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
    <div style="width:300px;height:300px;background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;display:flex;align-items:center;justify-content:center">
      <svg width="300" height="300" viewBox="0 0 260 260">
        <line x1="20" y1="40" x2="240" y2="40" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="130" x2="240" y2="130" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="210" x2="240" y2="210" stroke="#86b5ad" stroke-width="2"/>
        <text x="130" y="210" text-anchor="middle" font-family="'Andika',sans-serif" font-weight="700" font-size="160" fill="#d9ece8">a</text>
      </svg>
    </div>

    <button aria-label="Show or hide the letter" style="width:60px;height:60px;border-radius:50%;background:#ffffff;border:1.5px solid #bfddd7;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M2 12C2 12 5.5 5.5 12 5.5C18.5 5.5 22 12 22 12C22 12 18.5 18.5 12 18.5C5.5 18.5 2 12 2 12Z" stroke="#0f2e2b" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="12" r="3.2" stroke="#0f2e2b" stroke-width="1.8"/>
      </svg>
    </button>
  </div>

  <div style="padding:0 20px 28px">
    <div style="font-size:14px;font-weight:500;color:#5b7773;text-align:center;margin-bottom:14px">No score at level 1 — just copy the shape</div>
    <button style="width:100%;height:58px;border-radius:16px;border:none;background:#0f8f84;color:#ffffff;font-family:inherit;font-size:17px;font-weight:800">Next letter</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
