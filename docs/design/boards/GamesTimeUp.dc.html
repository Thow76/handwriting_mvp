<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Games — time's up, auto-submitted</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;padding:7px 13px;border-radius:999px;background:#d9365a;color:#ffffff">GAMES</span>
    <span style="font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid #bfddd7;background:#ffffff;color:#5b7773">Level 3 · Time's up</span>
  </div>
  <div style="padding:6px 20px 0;display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:#5b7773;white-space:nowrap">Time left</span>
    <div style="flex-grow:1;height:10px;background:#c6e3dd;border-radius:5px;overflow:hidden">
      <div style="width:0%;height:100%;background:#d9365a"></div>
    </div>
    <span style="font-size:13px;color:#d9365a;font-weight:700;white-space:nowrap">0s</span>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
    <div style="width:300px;height:300px;background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative">
      <svg width="300" height="300" viewBox="0 0 260 260">
        <line x1="20" y1="40" x2="240" y2="40" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="130" x2="240" y2="130" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="210" x2="240" y2="210" stroke="#86b5ad" stroke-width="2"/>
        <path d="M 168 98 C 188 108 188 158 168 178" fill="none" stroke="#0f2e2b" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <div style="position:absolute;left:0;right:0;bottom:0;background:rgba(217,119,87,0.12);border-top:1px solid rgba(217,119,87,0.35);border-radius:0 0 16px 16px;padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="#d9365a" stroke-width="2"/>
          <path d="M12 7V12L15.5 14" stroke="#d9365a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:15px;color:#d9365a">Time's up — submitted</span>
      </div>
    </div>
    <div style="font-size:13px;color:#5b7773;text-align:center;max-width:260px">No Finish tap needed — this happens on its own</div>
  </div>

  <div style="padding:0 20px 28px">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:#5b7773;font-size:13px">
      <span>Scoring your attempt</span>
      <span style="display:flex;gap:3px">
        <span style="width:4px;height:4px;border-radius:50%;background:#5b7773"></span>
        <span style="width:4px;height:4px;border-radius:50%;background:#5b7773"></span>
        <span style="width:4px;height:4px;border-radius:50%;background:#bfddd7"></span>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
