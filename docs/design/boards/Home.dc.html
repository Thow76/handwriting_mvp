<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — choose a practice mode</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:24px 20px 4px">
    <h1 style="margin:0 0 4px;font-size:26px;font-weight:800;color:#0f2e2b">Practice</h1>
    <div style="font-size:14px;color:#5b7773">What would you like to practise today?</div>
  </div>

  <div style="flex-grow:1;padding:16px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto">

    <!-- Alphabet card: outer container with two big visual buttons inside -->
    <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:16px">
      <div style="font-size:17px;font-weight:700;color:#0f2e2b;margin-bottom:12px">Alphabet</div>
      <div style="display:flex;gap:12px">
        <div style="flex:1;height:96px;background:#e8f5f2;border-radius:12px;display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Andika',sans-serif;font-size:32px;font-weight:700;color:#0f2e2b;letter-spacing:0.02em">A—Z</span>
        </div>
        <div style="flex:1;height:96px;background:#e8f5f2;border-radius:12px;display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Andika',sans-serif;font-size:32px;color:#0f2e2b;letter-spacing:0.02em">a—z</span>
        </div>
      </div>
    </div>

    <!-- Custom card: plain letter-tile grid, tap to pick, then Practice -->
    <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:16px">
      <div style="font-size:17px;font-weight:700;color:#0f2e2b;margin-bottom:12px">Choose your own</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px">
        <sc-for list="{{customLetters}}" as="l" hint-placeholder-count="26">
          <div style="aspect-ratio:1;background:{{l.bg}};border-radius:9px;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'Andika',sans-serif;font-size:17px;color:{{l.fg}}">{{l.ch}}</span>
          </div>
        </sc-for>
      </div>
      <button style="width:100%;height:58px;border-radius:16px;border:none;background:#0f8f84;color:#ffffff;font-family:inherit;font-size:17px;font-weight:800">Practice</button>
    </div>

    <!-- By shape card: three tiny line-diagrams, no explanatory sentence -->
    <div style="background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;padding:16px">
      <div style="font-size:17px;font-weight:700;color:#0f2e2b;margin-bottom:12px">By letter shape</div>
      <div style="display:flex;gap:10px">
        <div style="flex:1;background:#e8f5f2;border-radius:10px;padding:8px">
          <svg viewBox="0 0 100 70" width="100%" height="60">
            <rect x="0" y="35" width="100" height="20" fill="#0f8f84" opacity="0.14"/>
            <line x1="0" y1="10" x2="100" y2="10" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="35" x2="100" y2="35" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="55" x2="100" y2="55" stroke="#86b5ad" stroke-width="1.5"/>
            <text x="50" y="55" text-anchor="middle" font-family="'Andika',sans-serif" font-size="46" font-weight="700" fill="#0f2e2b">a</text>
          </svg>
        </div>
        <div style="flex:1;background:#e8f5f2;border-radius:10px;padding:8px">
          <svg viewBox="0 0 100 70" width="100%" height="60">
            <rect x="0" y="10" width="100" height="45" fill="#e39b2b" opacity="0.16"/>
            <line x1="0" y1="10" x2="100" y2="10" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="35" x2="100" y2="35" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="55" x2="100" y2="55" stroke="#86b5ad" stroke-width="1.5"/>
            <text x="50" y="55" text-anchor="middle" font-family="'Andika',sans-serif" font-size="46" font-weight="700" fill="#0f2e2b">b</text>
          </svg>
        </div>
        <div style="flex:1;background:#e8f5f2;border-radius:10px;padding:8px">
          <svg viewBox="0 0 100 70" width="100%" height="60">
            <rect x="0" y="55" width="100" height="10" fill="#d9365a" opacity="0.14"/>
            <line x1="0" y1="10" x2="100" y2="10" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="35" x2="100" y2="35" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <line x1="0" y1="55" x2="100" y2="55" stroke="#86b5ad" stroke-width="1.5"/>
            <line x1="0" y1="65" x2="100" y2="65" stroke="#bfddd7" stroke-width="1" stroke-dasharray="2 3"/>
            <text x="50" y="55" text-anchor="middle" font-family="'Andika',sans-serif" font-size="46" font-weight="700" fill="#0f2e2b">g</text>
          </svg>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chars = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const picked = new Set(['a','m','t']);
    return {
      customLetters: chars.map((ch) => ({
        ch,
        bg: picked.has(ch) ? '#ddf0ee' : '#e8f5f2',
        fg: picked.has(ch) ? '#0f8f84' : '#0f2e2b'
      }))
    };
  }
}
</script>
</body>
</html>
