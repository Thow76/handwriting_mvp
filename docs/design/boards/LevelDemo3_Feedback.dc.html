<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level 3 — feedback</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;padding:7px 13px;border-radius:999px;background:#0f8f84;color:#ffffff">PRACTICE</span>
    <span style="font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid #bfddd7;background:#ffffff;color:#5b7773">Level 3 · Feedback</span>
  </div>
  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px">
    <div style="width:170px;height:170px;border-radius:50%;background:conic-gradient(#e39b2b 0deg 244.8deg,#c6e3dd 244.8deg 360deg);display:flex;align-items:center;justify-content:center">
      <div style="width:136px;height:136px;border-radius:50%;background:#e8f5f2;display:flex;align-items:center;justify-content:center">
        <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:34px;color:#a86f12">Okay</span>
      </div>
    </div>
    <div style="background:#e8f5f2;border-radius:12px;padding:12px 16px;max-width:280px;text-align:center">
      <span style="font-size:14px;color:#0f2e2b">Direction: the bowl went clockwise, not anticlockwise</span>
    </div>
  </div>
  <div style="padding:20px;display:flex;gap:12px">
    <button style="flex:1;height:58px;border-radius:16px;border:1.5px solid #bfddd7;background:#ffffff;color:#0f2e2b;font-family:inherit;font-size:17px;font-weight:800">Try again</button>
    <button style="flex:1;height:58px;border-radius:16px;border:none;background:#0f8f84;color:#ffffff;font-family:inherit;font-size:17px;font-weight:800">Next letter</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
