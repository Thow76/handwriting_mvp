<!doctype html>
<html lang="en">
<head>

<title>Feedback — Good, just Next letter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Andika:wght@400;700&display=swap">

<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;padding:7px 13px;border-radius:999px;background:#0f8f84;color:#ffffff">PRACTICE</span>
    <span style="font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid #bfddd7;background:#ffffff;color:#5b7773">Feedback · Good</span>
  </div>
  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px">

    <div style="width:170px;height:170px;border-radius:50%;background:conic-gradient(#0f8f84 0deg 324deg,#c6e3dd 324deg 360deg);display:flex;align-items:center;justify-content:center">
      <div style="width:136px;height:136px;border-radius:50%;background:#e8f5f2;display:flex;align-items:center;justify-content:center">
        <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:34px;color:#0f8f84">Good</span>
      </div>
    </div>
  </div>
  <div style="padding:20px">
    <button style="width:100%;height:58px;border-radius:16px;border:none;background:#0f8f84;color:#ffffff;font-family:inherit;font-size:17px;font-weight:800">Next letter</button>
  </div>
  <div style="padding:0 20px 18px;text-align:center;font-size:12px;color:#5b7773">At "Good": just Next letter — no Try again.</div>
</div>
</x-dc>
