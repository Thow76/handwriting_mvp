<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:'Manrope',-apple-system,"Segoe UI",sans-serif;background:#e8f5f2}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#e8f5f2;display:flex;flex-direction:column">
  <div style="padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:11px;font-weight:800;letter-spacing:0.1em;padding:7px 13px;border-radius:999px;background:#d9365a;color:#ffffff">GAMES</span>
    <span style="font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid #bfddd7;background:#ffffff;color:#5b7773">Level 3 · Reveal</span>
  </div>
  <div style="padding:6px 20px 0;display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:#5b7773;white-space:nowrap">Hides in</span>
    <div style="flex-grow:1;height:10px;background:#c6e3dd;border-radius:5px;overflow:hidden">
      <div style="width:60%;height:100%;background:#e39b2b"></div>
    </div>
    <span style="font-size:13px;color:#e39b2b;font-weight:700;white-space:nowrap">3s</span>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px">
    <div style="width:300px;height:300px;background:#ffffff;border:1px solid #c6e3dd;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative">
      <svg width="300" height="300" viewBox="0 0 260 260">
        <defs>
          <marker id="arrowGR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#d9365a"/>
          </marker>
        </defs>
        <line x1="20" y1="40" x2="240" y2="40" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="130" x2="240" y2="130" stroke="#bfddd7" stroke-width="1.5" stroke-dasharray="3 4"/>
        <line x1="20" y1="210" x2="240" y2="210" stroke="#86b5ad" stroke-width="2"/>
        <text x="130" y="210" text-anchor="middle" font-family="'Andika',sans-serif" font-weight="700" font-size="160" fill="#d9ece8">a</text>
        <path d="M 168 98 C 188 108 188 158 168 178 C 140 198 108 178 108 148 C 108 120 140 100 166 108" fill="none" stroke="#d9365a" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGR)"/>
      </svg>
      <div style="position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:conic-gradient(#e39b2b 0deg 216deg,#c6e3dd 216deg 360deg);display:flex;align-items:center;justify-content:center">
        <div style="width:34px;height:34px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Andika',sans-serif;font-weight:700;font-size:15px;color:#e39b2b">3</span>
        </div>
      </div>
    </div>
    <div style="font-size:13px;color:#5b7773;text-align:center;max-width:260px">Look closely — the model hides automatically, no tap needed</div>
  </div>

  <div style="padding:0 20px 28px">
    <div style="font-size:13px;color:#5b7773;text-align:center">Get ready to draw it from memory</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
